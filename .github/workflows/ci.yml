name: CI
on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Private frontend and signing keys are accessed only by trusted prod releases.
      - run: |
          node --check scripts/build-web.mjs
          node --check src/native.js
          bash -n scripts/build-ios.sh
